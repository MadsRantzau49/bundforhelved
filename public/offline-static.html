<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17110d">
    <title>Offline | bund forhelved</title>
    <style>
      *{box-sizing:border-box}html{background:#17110d;overscroll-behavior:none}body{min-height:100svh;min-height:100dvh;margin:0;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));display:grid;place-items:center;background:#17110d;color:#fff7dd;font:15px system-ui,sans-serif}.card{width:min(100%,420px);padding:28px;border:1px solid #44372c;border-radius:18px;background:#201813}.mark{width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:#332414;color:#ffc83d;font-size:26px}small{color:#ffc83d;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{margin:10px 0 0;font:900 52px/0.9 Impact,sans-serif;text-transform:uppercase}p{color:#a99f91;line-height:1.6}a{min-height:50px;margin-top:18px;display:grid;place-items:center;border-radius:12px;background:#f5a900;color:#17110d;font-weight:850;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">×</div>
      <p><small>Forbindelsen røg</small></p>
      <h1>Uret venter</h1>
      <p>Timer og ranglister kræver internet, fordi alle tider bliver målt på serveren.</p>
      <a href="/timer">Prøv igen</a>
    </main>
    <script>window.addEventListener("online",()=>window.location.replace("/timer"));</script>
  </body>
</html>
